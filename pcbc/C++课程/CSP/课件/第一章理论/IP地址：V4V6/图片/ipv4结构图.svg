<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
<rect width="760" height="420" fill="#f8fafc" rx="12"/>
<text x="30" y="48" font-size="22" font-weight="bold" fill="#1e293b">IPv4 地址结构：32 位 = 4 段 × 8 位</text>
<rect x="60" y="80" width="140" height="110" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
<text x="130" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="#4f46e5">11000000</text>
<text x="130" y="150" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">192</text>
<text x="130" y="175" text-anchor="middle" font-size="12" fill="#64748b">第 1 段（8 位）</text>
<text x="208" y="140" text-anchor="middle" font-size="24" fill="#94a3b8">·</text>
<rect x="230" y="80" width="140" height="110" rx="10" fill="#ede9fe" stroke="#6366f1" stroke-width="2"/>
<text x="300" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="#4f46e5">10101000</text>
<text x="300" y="150" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">168</text>
<text x="300" y="175" text-anchor="middle" font-size="12" fill="#64748b">第 2 段（8 位）</text>
<text x="378" y="140" text-anchor="middle" font-size="24" fill="#94a3b8">·</text>
<rect x="400" y="80" width="140" height="110" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
<text x="470" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="#4f46e5">00000001</text>
<text x="470" y="150" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">1</text>
<text x="470" y="175" text-anchor="middle" font-size="12" fill="#64748b">第 3 段（8 位）</text>
<text x="548" y="140" text-anchor="middle" font-size="24" fill="#94a3b8">·</text>
<rect x="570" y="80" width="140" height="110" rx="10" fill="#ede9fe" stroke="#6366f1" stroke-width="2"/>
<text x="640" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="#4f46e5">00000001</text>
<text x="640" y="150" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">1</text>
<text x="640" y="175" text-anchor="middle" font-size="12" fill="#64748b">第 4 段（8 位）</text>
<rect x="60" y="220" width="650" height="70" rx="12" fill="url(#g1)"/>
<text x="385" y="256" text-anchor="middle" font-size="26" font-weight="bold" fill="#fff">192.168.1.1（点分十进制）</text>
<text x="385" y="280" text-anchor="middle" font-size="13" fill="#e0e7ff">每段取值范围 0 ~ 255　·　超过 255 即为非法地址</text>
<text x="60" y="340" font-size="15" fill="#334155">💡 类比：门牌号 —— 每一位都有固定位置，组成唯一的“住址”</text>
<text x="60" y="370" font-size="15" fill="#334155">⚠️ 陷阱：256.256.129.1 非法（256 &gt; 255）· 127.0.0.1 是回环地址（本机）</text>
</svg>