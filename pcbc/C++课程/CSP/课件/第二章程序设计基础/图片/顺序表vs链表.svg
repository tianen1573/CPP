<svg xmlns="http://www.w3.org/2000/svg" width="700" height="155" viewBox="0 0 700 155">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">顺序表 vs 链表</text>
  <text x="150" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">顺序表（数组）</text>
  <rect x="30" y="45" width="43" height="40" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="51.5" y="70" text-anchor="middle" font-size="13" fill="#1e1b4b" font-weight="500">5</text>
  <text x="51.5" y="39" text-anchor="middle" font-size="9" fill="#94a3b8">0</text>
  <rect x="78" y="45" width="43" height="40" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="99.5" y="70" text-anchor="middle" font-size="13" fill="#1e1b4b" font-weight="500">8</text>
  <text x="99.5" y="39" text-anchor="middle" font-size="9" fill="#94a3b8">1</text>
  <rect x="126" y="45" width="43" height="40" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="147.5" y="70" text-anchor="middle" font-size="13" fill="#1e1b4b" font-weight="500">3</text>
  <text x="147.5" y="39" text-anchor="middle" font-size="9" fill="#94a3b8">2</text>
  <rect x="174" y="45" width="43" height="40" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="195.5" y="70" text-anchor="middle" font-size="13" fill="#1e1b4b" font-weight="500">1</text>
  <text x="195.5" y="39" text-anchor="middle" font-size="9" fill="#94a3b8">3</text>
  <rect x="222" y="45" width="43" height="40" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="243.5" y="70" text-anchor="middle" font-size="13" fill="#1e1b4b" font-weight="500">9</text>
  <text x="243.5" y="39" text-anchor="middle" font-size="9" fill="#94a3b8">4</text>
  <text x="150" y="103" text-anchor="middle" font-size="10" fill="#6366f1">连续内存 · arr[i] 直达 O(1)</text>
  <line x1="280" y1="35" x2="280" y2="100" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="480" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">单向链表</text>
  <rect x="300" y="45" width="38" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="319" y="70" text-anchor="middle" font-size="12" fill="#78350f" font-weight="bold">5</text>
  <rect x="338" y="45" width="18" height="40" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="347" y="70" text-anchor="middle" font-size="9" fill="#b45309">→</text>
  <line x1="356" y1="65" x2="364" y2="65" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="364" y="45" width="38" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="383" y="70" text-anchor="middle" font-size="12" fill="#78350f" font-weight="bold">8</text>
  <rect x="402" y="45" width="18" height="40" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="411" y="70" text-anchor="middle" font-size="9" fill="#b45309">→</text>
  <line x1="420" y1="65" x2="428" y2="65" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="428" y="45" width="38" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="447" y="70" text-anchor="middle" font-size="12" fill="#78350f" font-weight="bold">3</text>
  <rect x="466" y="45" width="18" height="40" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="475" y="70" text-anchor="middle" font-size="9" fill="#b45309">→</text>
  <line x1="484" y1="65" x2="492" y2="65" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="492" y="45" width="38" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="511" y="70" text-anchor="middle" font-size="12" fill="#78350f" font-weight="bold">1</text>
  <rect x="530" y="45" width="18" height="40" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="539" y="70" text-anchor="middle" font-size="9" fill="#b45309">→</text>
  <line x1="548" y1="65" x2="556" y2="65" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="556" y="45" width="38" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="575" y="70" text-anchor="middle" font-size="12" fill="#78350f" font-weight="bold">9</text>
  <rect x="594" y="45" width="18" height="40" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="603" y="70" text-anchor="middle" font-size="8" fill="#b45309">⌀</text>
  <defs>
    <marker id="arr" markerWidth="5" markerHeight="5" refX="3" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#d97706"/>
    </marker>
  </defs>
  <text x="480" y="103" text-anchor="middle" font-size="10" fill="#b45309">节点分散 · 指针连接 · 遍历找第 i 个 O(n)</text>
</svg>