<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌲 二叉树可视化工具 — CSP-J 树专题</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; color: #1e293b; min-height: 100vh; }
.header { background: linear-gradient(135deg, #0f172a, #1e40af); color: #fff; padding: 20px 24px; text-align: center; }
.header h1 { font-size: 22px; }
.header p { font-size: 13px; opacity: .8; margin-top: 4px; }
.container { max-width: 1100px; margin: 0 auto; padding: 16px; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1); margin-bottom: 16px; overflow: hidden; }
.card-title { background: #f8fafc; padding: 12px 16px; font-size: 14px; font-weight: 600; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; gap: 8px; }
.card-body { padding: 16px; }

/* 控制面板 */
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.controls select, .controls input { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; background: #fff; }
.controls input { width: 160px; }
.btn { padding: 6px 14px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 500; transition: all .15s; }
.btn-primary { background: #2563eb; color: #fff; }
.btn-primary:hover { background: #1d4ed8; }
.btn-success { background: #059669; color: #fff; }
.btn-success:hover { background: #047857; }
.btn-warning { background: #d97706; color: #fff; }
.btn-warning:hover { background: #b45309; }
.btn-outline { background: transparent; border: 1px solid #cbd5e1; color: #475569; }
.btn-outline:hover { background: #f1f5f9; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-sm { padding: 4px 10px; font-size: 12px; }

/* SVG 画布 */
.canvas-wrap { width: 100%; overflow: auto; background: #fafbfc; border-radius: 8px; min-height: 360px; position: relative; }
.canvas-wrap svg { width: 100%; min-height: 360px; display: block; }

/* 状态面板 */
.info-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 13px; }
.info-item { background: #f8fafc; padding: 8px 12px; border-radius: 6px; border-left: 3px solid #2563eb; }
.info-item .label { font-weight: 600; color: #64748b; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
.info-item .value { margin-top: 2px; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; }
.highlight-orange { color: #ea580c; font-weight: 700; }
.highlight-green { color: #059669; font-weight: 700; }
.highlight-blue { color: #2563eb; font-weight: 700; }

/* 步进说明 */
.step-desc { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 12px 16px; margin-top: 12px; font-size: 14px; line-height: 1.6; }
.step-desc strong { color: #92400e; }

/* 标签页 */
.tabs { display: flex; gap: 4px; margin-bottom: 12px; }
.tab { padding: 6px 14px; border: 1px solid #e2e8f0; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 13px; background: #f8fafc; color: #64748b; }
.tab.active { background: #fff; color: #1e293b; font-weight: 600; border-bottom-color: #fff; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* 遍历结果 */
.traverse-result { display: flex; gap: 20px; flex-wrap: wrap; padding: 8px 0; }
.traverse-item { display: flex; align-items: center; gap: 6px; }
.traverse-item .badge { padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
.badge-pre { background: #dbeafe; color: #1d4ed8; }
.badge-in { background: #dcfce7; color: #15803d; }
.badge-post { background: #fef3c7; color: #92400e; }
.traverse-seq { font-family: 'Consolas', monospace; font-size: 13px; letter-spacing: 2px; }
.traverse-seq .active-char { background: #fde68a; border-radius: 3px; padding: 0 2px; }

/* 步骤条 */
.steps-bar { display: flex; align-items: center; gap: 6px; margin: 8px 0; }
.steps-bar span { font-size: 12px; color: #64748b; }

/* 自定义输入区 */
.custom-input-area { display: none; gap: 8px; flex-wrap: wrap; margin-top: 8px; padding: 12px; background: #f8fafc; border-radius: 8px; }
.custom-input-area.show { display: flex; }
.custom-input-area label { font-size: 12px; font-weight: 600; color: #475569; display: flex; flex-direction: column; gap: 4px; }
.custom-input-area input { padding: 4px 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-family: monospace; width: 150px; }

/* 响应式 */
@media (max-width: 700px) {
  .info-panel { grid-template-columns: 1fr; }
  .controls { flex-direction: column; align-items: stretch; }
  .controls select, .controls input { width: 100%; }
}
</style>
</head>
<body>

<div class="header">
  <h1>🌲 二叉树构建过程可视化</h1>
  <p>前序 / 中序 / 后序 → 一步步还原二叉树</p>
</div>

<div class="container">

  <!-- 预设选择 & 控制 -->
  <div class="card">
    <div class="card-title">🎯 选择题目</div>
    <div class="card-body">
      <div class="controls">
        <select id="presetSelect" onchange="loadPreset()" style="flex:1;min-width:200px">
          <optgroup label="📚 课件真题">
            <option value="pre-in-A:ABDCEF|BDAECF">真题2：前序ABDCEF 中序BDAECF</option>
            <option value="pre-in:ABDECF|DBEAFC">练习：前序ABDECF 中序DBEAFC</option>
            <option value="post-in:DEBFC A|DBEAF C">后序DEBFC A 中序DBEAFC</option>
            <option value="post-in:DGEBHFC A|DGBHE ACF">提高：后序+中序还原</option>
          </optgroup>
          <optgroup label="📝 基础练习">
            <option value="pre-in:1245367|4251637">前序1245367 中序4251637</option>
            <option value="pre-in:12345|24315">前序12345 中序24315</option>
            <option value="pre-in:ABCDEFG|CBDAFEG">前序ABCDEFG 中序CBDAFEG</option>
          </optgroup>
        </select>

        <div style="display:flex;gap:4px">
          <button class="btn btn-outline" onclick="prevStep()" id="btnPrev">◀ 上一步</button>
          <button class="btn btn-primary" onclick="nextStep()" id="btnNext">下一步 ▶</button>
        </div>
        <button class="btn btn-warning" onclick="resetSteps()">⟳ 重置</button>
        <button class="btn btn-outline btn-sm" onclick="toggleCustom()">✏️ 自定义</button>
      </div>

      <div class="custom-input-area" id="customArea">
        <label>遍历类型：<select id="customType"><option value="pre-in">前序+中序</option><option value="post-in">后序+中序</option></select></label>
        <label>序列1（前序/后序）：<input id="customSeq1" placeholder="如 ABDECF"></label>
        <label>序列2（中序）：<input id="customSeq2" placeholder="如 DBEAFC"></label>
        <button class="btn btn-success btn-sm" onclick="applyCustom()">✅ 应用</button>
      </div>

      <div class="steps-bar" id="stepsBar">
        <span>步骤：</span><span id="stepCounter">0 / 0</span>
      </div>
    </div>
  </div>

  <!-- 可视化画布 -->
  <div class="card">
    <div class="card-title">🌳 树形展示</div>
    <div class="card-body">
      <div class="canvas-wrap" id="canvasWrap">
        <svg id="treeSvg" viewBox="0 0 800 360"></svg>
      </div>
    </div>
  </div>

  <!-- 步骤说明 & 状态信息 -->
  <div class="card">
    <div class="card-title">📋 当前状态</div>
    <div class="card-body">
      <div class="info-panel">
        <div class="info-item">
          <div class="label">当前操作</div>
          <div class="value" id="currentOp">等待开始…</div>
        </div>
        <div class="info-item">
          <div class="label">当前子树</div>
          <div class="value" id="currentSubtree">—</div>
        </div>
        <div class="info-item">
          <div class="label">已确定的节点</div>
          <div class="value" id="placedNodes">—</div>
        </div>
        <div class="info-item">
          <div class="label">剩余待处理</div>
          <div class="value" id="remainingNodes">—</div>
        </div>
      </div>
      <div class="step-desc" id="stepDesc">点击"下一步"开始逐步构建二叉树 🚀</div>
    </div>
  </div>

  <!-- 遍历结果 -->
  <div class="card">
    <div class="card-title">📊 遍历结果</div>
    <div class="card-body">
      <div class="traverse-result" id="traverseResult">
        <div class="traverse-item"><span class="badge badge-pre">前序</span><span class="traverse-seq" id="preSeq">—</span></div>
        <div class="traverse-item"><span class="badge badge-in">中序</span><span class="traverse-seq" id="inSeq">—</span></div>
        <div class="traverse-item"><span class="badge badge-post">后序</span><span class="traverse-seq" id="postSeq">—</span></div>
      </div>
    </div>
  </div>
</div>

<script>
// ============== 核心状态 ==============
let state = {
  type: 'pre-in',       // 'pre-in' | 'post-in'
  seq1: '',             // 前序 / 后序
  seq2: '',             // 中序
  steps: [],            // 每一步的操作记录
  currentStep: -1,
  tree: null,           // 最终构建的树
};

// ============== 树数据结构 ==============
class TreeNode {
  constructor(val) { this.val = val; this.left = null; this.right = null; }
}

// ============== 生成构建步骤 ==============
function generateSteps(type, seq1, seq2) {
  const steps = [];
  if (type === 'pre-in') {
    genStepsPreIn(seq1, seq2, 0, seq1.length-1, 0, seq2.length-1, '根', steps);
  } else {
    genStepsPostIn(seq1, seq2, 0, seq1.length-1, 0, seq2.length-1, '根', steps);
  }
  steps.push({ type: 'done', desc: '✅ 二叉树构建完成！' });
  return steps;
}

function genStepsPreIn(pre, ino, preL, preR, inL, inR, role, steps) {
  if (preL > preR || inL > inR) return null;
  const rootVal = pre[preL];
  const idx = ino.indexOf(rootVal);
  const leftLen = idx - inL;
  const rightLen = inR - idx;

  steps.push({
    type: 'pick-root',
    val: rootVal,
    inL, inR, preL, preR, idx,
    role,
    desc: `🔍 前序第一个 <strong>${rootVal}</strong> 是当前子树的根节点` +
          `<br>➜ 中序中 <strong>${rootVal}</strong> 在第 ${idx+1} 位，左边 ${leftLen} 个为左子树，右边 ${rightLen} 个为右子树`
  });

  steps.push({
    type: 'split',
    val: rootVal,
    inL, inR, preL, preR, idx,
    leftPart: ino.substring(inL, idx),
    rightPart: ino.substring(idx+1, inR+1),
    desc: `📌 根 <strong>${rootVal}</strong> 的左右子树划分完成` +
          `<br>⬅ 左子树：<strong>${ino.substring(inL, idx) || '（空）'}</strong>` +
          `<br>➡ 右子树：<strong>${ino.substring(idx+1, inR+1) || '（空）'}</strong>`
  });

  const node = new TreeNode(rootVal);
  const leftPreL = preL + 1;
  const leftPreR = preL + leftLen;
  node.left = genStepsPreIn(pre, ino, leftPreL, leftPreR, inL, idx-1, '左孩子', steps);
  const rightPreL = leftPreR + 1;
  const rightPreR = preR;
  node.right = genStepsPreIn(pre, ino, rightPreL, rightPreR, idx+1, inR, '右孩子', steps);

  steps.push({
    type: 'build',
    val: rootVal,
    desc: `🏗️ 节点 <strong>${rootVal}</strong> 的左右子树已连接完毕`
  });

  return node;
}

function genStepsPostIn(post, ino, postL, postR, inL, inR, role, steps) {
  if (postL > postR || inL > inR) return null;
  const rootVal = post[postR];
  const idx = ino.indexOf(rootVal);
  const leftLen = idx - inL;
  const rightLen = inR - idx;

  steps.push({
    type: 'pick-root',
    val: rootVal,
    inL, inR, postL, postR, idx,
    role,
    desc: `🔍 后序最后一个 <strong>${rootVal}</strong> 是当前子树的根节点` +
          `<br>➜ 中序中 <strong>${rootVal}</strong> 在第 ${idx+1} 位，左边 ${leftLen} 个为左子树，右边 ${rightLen} 个为右子树`
  });

  steps.push({
    type: 'split',
    val: rootVal,
    inL, inR, postL, postR, idx,
    leftPart: ino.substring(inL, idx),
    rightPart: ino.substring(idx+1, inR+1),
    desc: `📌 根 <strong>${rootVal}</strong> 的左右子树划分完成` +
          `<br>⬅ 左子树：<strong>${ino.substring(inL, idx) || '（空）'}</strong>` +
          `<br>➡ 右子树：<strong>${ino.substring(idx+1, inR+1) || '（空）'}</strong>`
  });

  const node = new TreeNode(rootVal);
  const leftPostL = postL;
  const leftPostR = postL + leftLen - 1;
  node.left = genStepsPostIn(post, ino, leftPostL, leftPostR, inL, idx-1, '左孩子', steps);
  const rightPostL = leftPostR + 1;
  const rightPostR = postR - 1;
  node.right = genStepsPostIn(post, ino, rightPostL, rightPostR, idx+1, inR, '右孩子', steps);

  steps.push({
    type: 'build',
    val: rootVal,
    desc: `🏗️ 节点 <strong>${rootVal}</strong> 的左右子树已连接完毕`
  });

  return node;
}

// ============== 从步骤重建局部树 ==============
function buildTreeFromSteps(steps, maxStep) {
  const built = new Set();
  // 先找出所有已 pick-root 的节点
  const picked = [];
  for (let i = 0; i <= maxStep && i < steps.length; i++) {
    if (steps[i].type === 'pick-root') picked.push(steps[i].val);
  }
  // 从步骤中重建树结构
  const rootVal = steps[0]?.val;
  if (!rootVal) return null;

  const nodeMap = {};
  function getNode(v) {
    if (!nodeMap[v]) nodeMap[v] = new TreeNode(v);
    return nodeMap[v];
  }

  // 递归构建
  function buildFromStepsRec(idx, inL, inR, postL, postR, max) {
    if (idx > max || idx >= steps.length) return null;
    const s = steps[idx];
    if (s.type !== 'pick-root') return null;
    if (!built.has(s.val)) return null;
    const node = getNode(s.val);
    // 构建左右子树
    const leftLen = s.idx - inL;
    // 找到左子树的下一个 pick-root
    let leftChild = null, rightChild = null;
    for (let i = idx+1; i <= max && i < steps.length; i++) {
      if (steps[i].type === 'pick-root') {
        const si = steps[i];
        if (si.inL >= inL && si.inR <= s.idx-1 && !leftChild) {
          leftChild = buildFromStepsRec(i, inL, s.idx-1, -1, -1, max);
        } else if (si.inL >= s.idx+1 && si.inR <= inR && !rightChild) {
          rightChild = buildFromStepsRec(i, s.idx+1, inR, -1, -1, max);
        }
      }
    }
    node.left = leftChild;
    node.right = rightChild;
    return node;
  }

  // 从第0步开始，但只构建到 maxStep
  for (let i = 0; i <= maxStep && i < steps.length; i++) {
    if (steps[i].type === 'pick-root') built.add(steps[i].val);
  }

  return buildFromStepsRec(0, 0, state.seq2.length-1, 0, state.seq1.length-1, maxStep);
}

// ============== SVG 绘制 ==============
function drawTreeSVG(root, highlightVals = [], highlightEdge = null) {
  const svg = document.getElementById('treeSvg');
  if (!root) {
    svg.innerHTML = '<text x="400" y="180" text-anchor="middle" font-size="16" fill="#94a3b8">点击"下一步"开始构建 🚀</text>';
    return;
  }

  // 计算布局
  const layout = [];
  function calcLayout(node, depth, offset) {
    if (!node) return offset;
    const left = calcLayout(node.left, depth+1, offset);
    const x = left;
    layout.push({ node, x, y: depth * 70 + 60, depth });
    return calcLayout(node.right, depth+1, x + 1) + 1;
  }
  calcLayout(root, 0, 0);

  const count = layout.length;
  const w = Math.max(800, count * 70);
  const h = Math.max(360, (Math.max(...layout.map(l=>l.depth)) + 1) * 70 + 60);

  const nodeMap = {};
  layout.forEach(l => { nodeMap[l.node.val] = l; });

  // 找到有值的节点集
  const nodeVals = new Set(layout.map(l => l.node.val));

  // 生成 SVG
  let svgContent = `<defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>`;

  // 画边
  for (const l of layout) {
    if (l.node.left && nodeMap[l.node.left.val]) {
      const child = nodeMap[l.node.left.val];
      const isHL = highlightEdge === `${l.node.val}->${l.node.left.val}`;
      const stroke = isHL ? '#ea580c' : '#94a3b8';
      const sw = isHL ? 3 : 1.5;
      const gap = 22;
      const angle = Math.atan2(child.y - l.y, child.x - l.x);
      const sx = l.x + gap * Math.cos(angle);
      const sy = l.y + gap * Math.sin(angle);
      const ex = child.x - gap * Math.cos(angle);
      const ey = child.y - gap * Math.sin(angle);
      svgContent += `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${stroke}" stroke-width="${sw}" marker-end="url(#arrow)"/>`;
    }
    if (l.node.right && nodeMap[l.node.right.val]) {
      const child = nodeMap[l.node.right.val];
      const isHL = highlightEdge === `${l.node.val}->${l.node.right.val}`;
      const stroke = isHL ? '#ea580c' : '#94a3b8';
      const sw = isHL ? 3 : 1.5;
      const gap = 22;
      const angle = Math.atan2(child.y - l.y, child.x - l.x);
      const sx = l.x + gap * Math.cos(angle);
      const sy = l.y + gap * Math.sin(angle);
      const ex = child.x - gap * Math.cos(angle);
      const ey = child.y - gap * Math.sin(angle);
      svgContent += `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${stroke}" stroke-width="${sw}" marker-end="url(#arrow)"/>`;
    }
  }

  // 画节点
  for (const l of layout) {
    const isHL = highlightVals.includes(l.node.val);
    const fill = isHL ? '#fde68a' : (l.node.left || l.node.right ? '#dbeafe' : '#dcfce7');
    const stroke = isHL ? '#ea580c' : (l.node.left || l.node.right ? '#2563eb' : '#059669');
    const r = isHL ? 24 : 22;
    svgContent += `<g filter="url(#shadow)">
      <circle cx="${l.x}" cy="${l.y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${isHL?2.5:1.5}"/>
      <text x="${l.x}" y="${l.y+4}" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">${l.node.val}</text>
    </g>`;
  }

  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.innerHTML = svgContent;
}

// ============== 计算最终遍历 ==============
function computeTraversals(root) {
  const pre = [], ino = [], post = [];
  function dfs(n) {
    if (!n) return;
    pre.push(n.val);
    dfs(n.left);
    ino.push(n.val);
    dfs(n.right);
    post.push(n.val);
  }
  dfs(root);
  return { pre: pre.join(''), ino: ino.join(''), post: post.join('') };
}

// ============== 更新界面 ==============
function updateView() {
  const { steps, currentStep, seq1, seq2, type } = state;
  const totalSteps = steps.length;

  document.getElementById('stepCounter').textContent =
    `${currentStep + 1} / ${totalSteps}`;

  document.getElementById('btnPrev').disabled = currentStep <= 0;
  document.getElementById('btnNext').disabled = currentStep >= totalSteps - 1;

  if (currentStep < 0 || totalSteps === 0) {
    document.getElementById('currentOp').textContent = '等待开始…';
    document.getElementById('currentSubtree').textContent = '—';
    document.getElementById('placedNodes').textContent = '—';
    document.getElementById('remainingNodes').textContent = '—';
    document.getElementById('stepDesc').textContent = '点击"下一步"开始逐步构建二叉树 🚀';
    const svg = document.getElementById('treeSvg');
    svg.innerHTML = '<text x="400" y="180" text-anchor="middle" font-size="16" fill="#94a3b8">点击"下一步"开始构建 🚀</text>';
    document.getElementById('preSeq').textContent = '—';
    document.getElementById('inSeq').textContent = '—';
    document.getElementById('postSeq').textContent = '—';
    return;
  }

  const s = steps[currentStep];
  const desc = s.desc;
  document.getElementById('stepDesc').innerHTML = desc;

  // 已放置的节点
  const placed = [];
  for (let i = 0; i <= currentStep; i++) {
    if (steps[i].type === 'pick-root' || steps[i].type === 'build') placed.push(steps[i].val);
  }
  const placedSet = new Set(placed);
  document.getElementById('placedNodes').textContent = [...placedSet].join(', ') || '—';

  // 剩余节点
  const allNodes = [...new Set(seq1.split('').filter(c => c !== ' '))];
  const remaining = allNodes.filter(v => !placedSet.has(v));
  document.getElementById('remainingNodes').textContent = remaining.join(', ') || '✅ 全部处理完成';

  // 当前操作
  if (s.type === 'pick-root') {
    document.getElementById('currentOp').innerHTML = `🎯 确定根节点：<span class="highlight-orange">${s.val}</span>`;
    const left = seq2.substring(s.inL, s.idx);
    const right = seq2.substring(s.idx+1, s.inR+1);
    document.getElementById('currentSubtree').innerHTML =
      `中序区间 [${s.inL+1}~${s.inR+1}]：${seq2.substring(s.inL, s.inR+1)}` +
      `<br>⬅ 左：${left || '空'}　➡ 右：${right || '空'}`;
  } else if (s.type === 'split') {
    document.getElementById('currentOp').innerHTML = `✂️ 划分左右子树：<span class="highlight-green">${s.val}</span>`;
    document.getElementById('currentSubtree').innerHTML = `左：${s.leftPart || '空'}　|　右：${s.rightPart || '空'}`;
  } else if (s.type === 'build') {
    document.getElementById('currentOp').innerHTML = `🔗 连接节点：<span class="highlight-blue">${s.val}</span>`;
    document.getElementById('currentSubtree').innerHTML = `✅ ${s.val} 的左右子树已连接`;
  } else if (s.type === 'done') {
    document.getElementById('currentOp').innerHTML = '✅ 构建完成！';
    document.getElementById('currentSubtree').innerHTML = '🎉 整棵树已构建完毕';
  }

  // 画树（展示到当前步骤为止的树）
  const treeRoot = buildTreeFromSteps(steps, currentStep);
  const highlightVals = s.type === 'pick-root' ? [s.val] : (s.type === 'split' ? [s.val] : []);
  drawTreeSVG(treeRoot, s.val ? [s.val] : []);

  // 遍历结果（如果是 done 状态，显示完整遍历）
  if (s.type === 'done' && state.tree) {
    const trav = computeTraversals(state.tree);
    document.getElementById('preSeq').innerHTML = trav.pre.split('').map(c => `<span class="active-char">${c}</span>`).join('');
    document.getElementById('inSeq').innerHTML = trav.ino.split('').map(c => `<span class="active-char">${c}</span>`).join('');
    document.getElementById('postSeq').innerHTML = trav.post.split('').map(c => `<span class="active-char">${c}</span>`).join('');
  } else if (treeRoot) {
    const trav = computeTraversals(treeRoot);
    const highlightChar = s.val || '';
    document.getElementById('preSeq').innerHTML = trav.pre.split('').map(c => c === highlightChar ? `<span class="active-char">${c}</span>` : c).join('');
    document.getElementById('inSeq').innerHTML = trav.ino.split('').map(c => c === highlightChar ? `<span class="active-char">${c}</span>` : c).join('');
    document.getElementById('postSeq').innerHTML = trav.post.split('').map(c => c === highlightChar ? `<span class="active-char">${c}</span>` : c).join('');
  }
}

// ============== 控制函数 ==============
function loadPreset() {
  const val = document.getElementById('presetSelect').value;
  if (!val) return;
  const [type, seqStr] = val.split(':');
  const [s1, s2] = seqStr.split('|');
  state.type = type;
  state.seq1 = s1;
  state.seq2 = s2;
  initSteps();
}

function initSteps() {
  state.steps = generateSteps(state.type, state.seq1, state.seq2);
  state.currentStep = -1;
  state.tree = buildTreeFromSteps(state.steps, state.steps.length - 2);
  // 显示初始信号
  drawTreeSVG(null);
  updateView();
  // 设置 disabled 状态
  document.getElementById('btnNext').disabled = false;
}

function nextStep() {
  if (state.currentStep < state.steps.length - 1) {
    state.currentStep++;
    updateView();
  }
}

function prevStep() {
  if (state.currentStep > 0) {
    state.currentStep--;
    // 如果是 done 类型，回到上一步
    updateView();
  }
}

function resetSteps() {
  state.currentStep = -1;
  updateView();
  const svg = document.getElementById('treeSvg');
  svg.innerHTML = '<text x="400" y="180" text-anchor="middle" font-size="16" fill="#94a3b8">点击"下一步"开始构建 🚀</text>';
  document.getElementById('stepDesc').textContent = '点击"下一步"开始逐步构建二叉树 🚀';
  document.getElementById('currentOp').textContent = '等待开始…';
  document.getElementById('currentSubtree').textContent = '—';
  document.getElementById('placedNodes').textContent = '—';
  document.getElementById('remainingNodes').textContent = '—';
  document.getElementById('preSeq').textContent = '—';
  document.getElementById('inSeq').textContent = '—';
  document.getElementById('postSeq').textContent = '—';
  document.getElementById('stepCounter').textContent = `0 / ${state.steps.length}`;
  document.getElementById('btnPrev').disabled = true;
  document.getElementById('btnNext').disabled = false;
}

function toggleCustom() {
  const area = document.getElementById('customArea');
  area.classList.toggle('show');
}

function applyCustom() {
  const type = document.getElementById('customType').value;
  const s1 = document.getElementById('customSeq1').value.trim().toUpperCase();
  const s2 = document.getElementById('customSeq2').value.trim().toUpperCase();
  if (!s1 || !s2) { alert('请输入两个序列'); return; }
  if (s1.length !== s2.length) { alert('两个序列长度必须相等'); return; }
  // 检查字符集是否一致
  const set1 = new Set(s1.split('')), set2 = new Set(s2.split(''));
  if ([...set1].join('') !== [...set2].join('')) { alert('两个序列的字符集不一致，请检查'); return; }

  state.type = type;
  state.seq1 = s1;
  state.seq2 = s2;
  initSteps();
  document.getElementById('customArea').classList.remove('show');
}

// ============== 键盘快捷键 ==============
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    nextStep();
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    prevStep();
  } else if (e.key === 'r' || e.key === 'R') {
    e.preventDefault();
    resetSteps();
  }
});

// ============== 初始化 ==============
loadPreset();
</script>
