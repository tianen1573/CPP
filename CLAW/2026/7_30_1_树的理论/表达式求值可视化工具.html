<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表达式求值 · 栈模拟演示</title>
<style>
  :root {
    --primary: #6366f1;
    --primary-2: #8b5cf6;
    --bg: #f4f5fb;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --ok: #10b981;
    --warn: #f59e0b;
    --err: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #eef1ff 0%, #f6f4ff 50%, #fdf2f8 100%);
    min-height: 100vh; color: var(--text); padding: 20px;
  }
  .app {
    max-width: 980px; margin: 0 auto;
    background: var(--card); border-radius: 18px;
    box-shadow: 0 10px 40px rgba(99,102,241,.15);
    overflow: hidden;
  }
  .app-header {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #fff; padding: 22px 28px;
  }
  .app-header h1 { font-size: 22px; letter-spacing: .5px; }
  .app-header p { font-size: 13px; opacity: .85; margin-top: 6px; }
  .body { padding: 22px 28px 28px; }

  /* 模式 & 示例 */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .seg { display: inline-flex; background: #eef0fb; border-radius: 10px; padding: 4px; }
  .seg button {
    border: none; background: transparent; padding: 8px 18px; border-radius: 8px;
    font-size: 14px; cursor: pointer; color: var(--muted); font-weight: 600;
  }
  .seg button.active { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(99,102,241,.4); }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
  .examples button {
    border: 1.5px solid #d8dcf5; background: #fff; color: var(--text);
    padding: 7px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: monospace;
    transition: all .15s;
  }
  .examples button:hover { border-color: var(--primary); color: var(--primary); }
  .examples button .tag { color: var(--muted); font-family: sans-serif; font-size: 11px; }

  /* 自定义输入 */
  .custom { display: flex; gap: 8px; margin-bottom: 16px; }
  .custom input {
    flex: 1; padding: 10px 14px; border: 1.5px solid #d8dcf5; border-radius: 10px;
    font-size: 15px; font-family: monospace; outline: none; transition: border .15s;
  }
  .custom input:focus { border-color: var(--primary); }
  .custom button {
    padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; font-weight: 600;
  }

  /* 控制 */
  .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  .controls button {
    border: 1.5px solid #d8dcf5; background: #fff; padding: 8px 16px; border-radius: 10px;
    cursor: pointer; font-size: 14px; transition: all .15s;
  }
  .controls button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
  .controls button:disabled { opacity: .4; cursor: not-allowed; }
  .controls button.play { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border: none; }
  .speed { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: 13px; color: var(--muted); }
  .speed input { width: 100px; accent-color: var(--primary); }

  /* 主区域 */
  .stage { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
  .expr-panel, .stack-panel { flex: 1; min-width: 280px; background: #fafbff; border-radius: 14px; padding: 16px; }
  .panel-title { font-size: 13px; color: var(--muted); margin-bottom: 12px; font-weight: 600; letter-spacing: .5px; }
  .tokens { display: flex; flex-wrap: wrap; gap: 8px; }
  .token {
    min-width: 40px; text-align: center; padding: 10px 6px; border-radius: 10px;
    background: #fff; border: 2px solid #e2e6f7; font-family: monospace; font-size: 17px; font-weight: 700;
    transition: all .2s; color: var(--muted);
  }
  .token.done { opacity: .35; border-style: dashed; }
  .token.current { border-color: var(--primary); color: var(--primary); transform: scale(1.15); box-shadow: 0 4px 14px rgba(99,102,241,.35); }
  .token.operator { color: #7c3aed; }

  .stack-box {
    min-height: 200px;
    background: linear-gradient(180deg, #f7f6ff, #efedff);
    border: 3px solid #a5b4fc;
    border-top: 3px dashed #a5b4fc;   /* 顶部开口 */
    border-radius: 4px 4px 14px 14px;
    box-shadow: inset 0 3px 12px rgba(99,102,241,.14), 0 2px 6px rgba(99,102,241,.08);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 8px; padding: 14px 12px; position: relative;
  }
  .stack-box.empty::after {
    content: "（空的盒子）"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #c0c6de; font-size: 14px;
  }
  .stack-top, .stack-bottom { text-align: center; font-size: 12px; color: var(--muted); padding: 2px 0; }
  .stack-top { color: var(--primary); font-weight: 700; }
  .stack-item {
    min-width: 56px; text-align: center; padding: 10px 8px; border-radius: 10px;
    background: linear-gradient(135deg, #eef2ff, #f5f3ff); border: 2px solid var(--primary);
    color: var(--primary); font-family: monospace; font-size: 17px; font-weight: 700;
  }
  .stack-item.entering { animation: pushIn .28s ease-out; }
  @keyframes pushIn { from { transform: translateY(-26px) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }

  /* 日志 */
  .log { background: #fafbff; border-radius: 14px; padding: 16px; margin-bottom: 18px; max-height: 220px; overflow-y: auto; }
  .log-title { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
  .log ul { list-style: none; }
  .log li {
    padding: 6px 10px; border-radius: 8px; font-size: 14px; font-family: monospace;
    border-left: 3px solid transparent; margin-bottom: 4px;
  }
  .log li.push { border-left-color: var(--primary); background: #f0f2ff; }
  .log li.calc { border-left-color: var(--ok); background: #ecfdf5; }
  .log li.pop { border-left-color: var(--warn); background: #fffbeb; }
  .log li.result { border-left-color: var(--primary-2); background: #f5f3ff; font-weight: 700; }

  .calc-panel { background: #fafbff; border-radius: 14px; padding: 14px 18px; margin-bottom: 18px; }
  .calc-display {
    font-family: monospace; font-size: 30px; font-weight: 700; text-align: center;
    padding: 12px; min-height: 56px; letter-spacing: 2px;
    background: #fff; border: 2px dashed #e2e6f7; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
  }
  .calc-display .placeholder { font-size: 14px; color: #c0c6de; font-weight: 400; font-family: sans-serif; }
  .calc-display .opr { color: var(--primary); }
  .calc-display .op-sym { color: #7c3aed; font-size: 36px; }
  .calc-display .eq { color: var(--muted); font-size: 24px; }
  .calc-display .res { color: var(--ok); font-size: 38px; }
  .calc-display .pop { animation: popIn .3s ease-out; display: inline-block; }
  @keyframes popIn { from { transform: scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }

  .result-banner {
    display: none; text-align: center; padding: 16px; border-radius: 14px;
    background: linear-gradient(135deg, #ecfdf5, #f0fdf4); border: 2px solid var(--ok);
    font-size: 18px; font-weight: 700; color: #047857;
  }
  .result-banner.show { display: block; animation: pushIn .3s ease-out; }
  .result-banner .big { font-size: 26px; }
  .tip { margin-top: 14px; font-size: 13px; color: var(--muted); line-height: 1.7; }
  .tip b { color: var(--text); }
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <h1>🧮 表达式求值 · 栈模拟演示</h1>
    <p>后缀表达式（从左到右扫，先弹右操作数）· 前缀表达式（从右到左扫，先弹左操作数）</p>
  </div>
  <div class="body">
    <div class="toolbar">
      <div class="seg">
        <button id="mode-postfix" class="active" onclick="setMode('postfix')">后缀</button>
        <button id="mode-prefix" onclick="setMode('prefix')">前缀</button>
      </div>
      <div class="examples" id="example-btns"></div>
    </div>

    <div class="custom">
      <input id="custom-input" placeholder="自定义表达式，如：2 3 + 8 4 - * 5 /（空格分隔，支持多位数）" spellcheck="false">
      <button onclick="loadCustom()">开始演示</button>
    </div>

    <div class="controls">
      <button onclick="step(-1)" id="btn-prev" disabled>⏮ 上一步</button>
      <button onclick="step(1)" id="btn-next">下一步 ⏭</button>
      <button class="play" id="btn-play" onclick="togglePlay()">▶ 自动播放</button>
      <button onclick="reset()">🔄 重置</button>
      <div class="speed">速度 <input type="range" id="speed" min="200" max="2000" step="100" value="900"></div>
    </div>

    <div class="stage">
      <div class="expr-panel">
        <div class="panel-title">表达式（点击高亮 = 当前扫描位置）</div>
        <div class="tokens" id="tokens"></div>
      </div>
      <div class="stack-panel">
        <div class="panel-title">栈 · 盒模型（栈顶在上）</div>
        <div class="stack-top">⬇ 栈顶（开口 · 先弹出）</div>
        <div class="stack-box empty" id="stack-box"></div>
        <div class="stack-bottom">⬆ 栈底（后弹出）</div>
      </div>
    </div>

    <div class="calc-panel" id="calc-panel">
      <div class="panel-title">🔢 本次运算</div>
      <div class="calc-display" id="calc-display"><span class="placeholder">等待运算符…（遇到 + − × ÷ 时在此展示计算过程）</span></div>
    </div>

    <div class="log">
      <div class="log-title">📝 操作日志</div>
      <ul id="log-list"></ul>
    </div>

    <div class="result-banner" id="result-banner"></div>

    <div class="tip">
      <b>💡 规则提醒：</b>后缀从左往右扫，遇操作数入栈、遇运算符弹出两个计算（<b>先弹右操作数 b，再弹左操作数 a</b>，算 a op b）；前缀从右往左扫，遇运算符<b>先弹左操作数 a，再弹右操作数 b</b>，算 a op b。减法和除法的顺序不能反！
    </div>
  </div>
</div>

<script>
// ===== 预置示例 =====
const EXAMPLES = {
  postfix: [
    { expr: '2 3 + 8 4 - * 5 /', note: '(2+3)×(8-4)÷5 · 课件例' },
    { expr: '5 1 2 + 4 * + 3 -', note: '5+(1+2)×4-3 · 练习23' },
    { expr: '10 4 - 3 *', note: '(10-4)×3 · 入门' },
  ],
  prefix: [
    { expr: '/ * + 2 3 - 8 4 5', note: '(2+3)×(8-4)÷5 · 课件例' },
    { expr: '- + 2 3 4', note: '(2+3)-4 · 入门' },
    { expr: '* + 5 3 8', note: '(5+3)×8' },
  ],
};

let mode = 'postfix';
let tokens = [];
let steps = [];
let cur = -1;          // 当前步索引（-1 = 初始）
let timer = null;
let playing = false;

// ===== 状态机：预计算全部步骤 =====
// 每步: { type: 'push'|'calc'|'pop'|'result', idx: 扫描位置, text, stack: 快照 }
function buildSteps(m, tk) {
  const steps = [];
  const stack = [];
  const seq = m === 'postfix' ? tk.map((t, i) => ({ t, i })) : tk.map((t, i) => ({ t, i })).reverse();
  for (const { t, i } of seq) {
    if (/^\d+$/.test(t)) {
      stack.push(t);
      steps.push({ type: 'push', idx: i, text: `将 ${t} 入栈`, stack: [...stack] });
    } else if ('+-*/'.includes(t)) {
      const x = stack.pop();  // 后弹出（后缀=右操作数；前缀=左操作数）
      const y = stack.pop();  // 先弹出（后缀=左操作数；前缀=右操作数）
      const a = m === 'postfix' ? y : x;
      const b = m === 'postfix' ? x : y;
      const r = calc(a, b, t);
      steps.push({ type: 'calc', idx: i, text: `弹出 ${a}、${b} → ${a} ${t} ${b} = ${r}，结果入栈`, stack: [...stack, String(r)], a: a, b: b, op: t, result: r });
      stack.push(String(r));
    }
  }
  steps.push({ type: 'result', idx: -1, text: `扫描完毕！栈中唯一元素 = ${stack[stack.length-1]}`, stack: [...stack], result: stack[stack.length-1] });
  return steps;
}

function calc(a, b, op) {
  const x = Number(a), y = Number(b);
  switch (op) {
    case '+': return x + y;
    case '-': return x - y;
    case '*': return x * y;
    case '/': return Math.floor(x / y); // 整型除法（C++ 风格）
  }
}

// ===== 渲染 =====
function renderTokens(curStep) {
  const box = document.getElementById('tokens');
  box.innerHTML = '';
  tokens.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'token' + (/[+\-*/]/.test(t) ? ' operator' : '');
    el.textContent = t;
    if (curStep !== null) {
      const idx = curStep.idx;
      if (i === idx) el.classList.add('current');
      else {
        // 已处理判定
        const done = mode === 'postfix' ? (idx >= 0 && i < idx) : (idx >= 0 && i > idx);
        if (done) el.classList.add('done');
      }
    }
    box.appendChild(el);
  });
}

let prevStack = [];
function renderStack(curStep) {
  const box = document.getElementById('stack-box');
  const stack = curStep ? curStep.stack : [];
  box.classList.toggle('empty', stack.length === 0);
  box.innerHTML = '';
  if (!curStep) return;
  // 栈顶在上：倒序渲染（数组底→顶，渲染成盒内下→上）
  const isPush = (curStep.type === 'push' || curStep.type === 'calc') && stack.length === prevStack.length + 1;
  const topVal = isPush ? stack[stack.length - 1] : null;
  [...stack].reverse().forEach(v => {
    const el = document.createElement('div');
    el.className = 'stack-item';
    if (v === topVal) el.classList.add('entering');
    el.textContent = v;
    box.appendChild(el);
  });
  prevStack = stack;
}

function renderLog() {
  const ul = document.getElementById('log-list');
  ul.innerHTML = '';
  steps.slice(0, cur + 1).forEach(s => {
    const li = document.createElement('li');
    li.className = s.type === 'result' ? 'result' : s.type;
    li.textContent = (s.type === 'push' ? '⤵ ' : s.type === 'calc' ? '⚡ ' : s.type === 'result' ? '🎉 ' : '') + s.text;
    ul.appendChild(li);
  });
  ul.scrollTop = ul.scrollHeight;
}

function renderResult() {
  const banner = document.getElementById('result-banner');
  const last = steps[cur];
  if (last && last.type === 'result') {
    banner.innerHTML = `✅ 计算结果：<span class="big">${last.stack[0]}</span>`;
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}

function renderCalc() {
  const el = document.getElementById('calc-display');
  const s = cur >= 0 ? steps[cur] : null;
  let html = '';
  if (s && s.type === 'calc') {
    html = `<span class="opr pop">${s.a}</span><span class="op-sym pop">${s.op}</span><span class="opr pop">${s.b}</span><span class="eq pop">=</span><span class="res pop">${s.result}</span>`;
  } else if (s && s.type === 'result') {
    html = `<span style="font-size:18px;color:var(--muted);font-family:sans-serif">最终结果</span><span class="eq pop">=</span><span class="res pop">${s.result}</span>`;
  } else {
    html = '<span class="placeholder">等待运算符…（遇到 + − × ÷ 时在此展示计算过程）</span>';
  }
  if (el.innerHTML !== html) {
    el.innerHTML = html;
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');
  }
}

function render() {
  const stepData = cur >= 0 ? steps[cur] : null;
  renderTokens(stepData);
  renderStack(stepData);
  renderCalc();
  renderLog();
  renderResult();
  document.getElementById('btn-prev').disabled = cur <= 0;
  document.getElementById('btn-next').disabled = cur >= steps.length - 1;
  if (cur >= steps.length - 1 && playing) stopPlay();
}

// ===== 控制 =====
function setMode(m) {
  mode = m;
  document.getElementById('mode-postfix').classList.toggle('active', m === 'postfix');
  document.getElementById('mode-prefix').classList.toggle('active', m === 'prefix');
  renderExamples();
  loadExample(EXAMPLES[m][0].expr);
}

function renderExamples() {
  const box = document.getElementById('example-btns');
  box.innerHTML = '';
  EXAMPLES[mode].forEach(ex => {
    const b = document.createElement('button');
    b.innerHTML = `${ex.expr} <span class="tag">${ex.note}</span>`;
    b.onclick = () => loadExample(ex.expr);
    box.appendChild(b);
  });
}

function loadExample(expr) {
  const m = detectMode(expr);
  if (m !== mode) {
    mode = m;
    document.getElementById('mode-postfix').classList.toggle('active', m === 'postfix');
    document.getElementById('mode-prefix').classList.toggle('active', m === 'prefix');
    renderExamples();
  }
  loadTokens(expr.split(/\s+/));
}

// 根据首字符/首 token 猜测模式：运算符开头 → 前缀；数字开头 → 后缀
function detectMode(expr) {
  const first = expr.trim().split(/\s+/)[0];
  return /[+\-*/]/.test(first) ? 'prefix' : 'postfix';
}

function loadCustom() {
  const raw = document.getElementById('custom-input').value.trim();
  if (!raw) return;
  const tk = raw.split(/\s+/);
  const ok = tk.every(t => /^\d+$/.test(t) || '+-*/'.includes(t));
  if (!ok) { alert('表达式格式不对：只能包含数字和 + - * /（空格分隔）'); return; }
  const m = detectMode(raw);
  mode = m;
  document.getElementById('mode-postfix').classList.toggle('active', m === 'postfix');
  document.getElementById('mode-prefix').classList.toggle('active', m === 'prefix');
  renderExamples();
  loadTokens(tk);
}

function loadTokens(tk) {
  stopPlay();
  tokens = tk;
  steps = buildSteps(mode, tokens);
  cur = -1;
  document.getElementById('custom-input').value = tk.join(' ');
  render();
}

function step(d) {
  const next = Math.min(Math.max(cur + d, -1), steps.length - 1);
  if (next !== cur) { cur = next; render(); }
}

function togglePlay() {
  playing ? stopPlay() : startPlay();
}

function startPlay() {
  if (cur >= steps.length - 1) { cur = -1; render(); }
  playing = true;
  document.getElementById('btn-play').textContent = '⏸ 暂停';
  const speed = Number(document.getElementById('speed').value);
  timer = setInterval(() => {
    if (cur >= steps.length - 1) { stopPlay(); return; }
    cur++; render();
  }, speed);
}

function stopPlay() {
  playing = false;
  clearInterval(timer);
  timer = null;
  document.getElementById('btn-play').textContent = '▶ 自动播放';
}

function reset() {
  stopPlay();
  cur = -1;
  render();
}

// ===== 初始化 =====
renderExamples();
loadExample(EXAMPLES.postfix[0].expr);
</script>
</body>
</html>
