<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>树 综合练习 · 第5套（B卷）</title>  <!-- 如无指定主题，改为：<title>树 综合练习 · 第5套（B卷）</title> -->
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1e293b;
    --text-secondary: #64748b;
    --border: #e2e8f0;
    --accent: #6366f1;
    --correct: #22c55e;
    --wrong: #ef4444;
    --correct-bg: #dcfce7;
    --wrong-bg: #fce4ec;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --radius: 12px;
    --transition: 0.25s cubic-bezier(.4,0,.2,1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  .app-header {
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    color: #fff;
    padding: 20px 24px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(99,102,241,0.3);
  }
  .app-header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  .app-header p { font-size: 13px; opacity: 0.85; margin-top: 2px; }

  .nav-tabs {
    display: flex; gap: 2px;
    background: var(--card-bg);
    padding: 6px 8px;
    margin: 16px 16px 0;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .nav-tab {
    flex: 1; min-width: 80px;
    padding: 10px 12px;
    border: none; background: transparent;
    font-size: 14px; font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    border-radius: 8px;
    transition: var(--transition);
    text-align: center;
  }
  .nav-tab:hover { background: #f1f5f9; color: var(--text); }
  .nav-tab.active { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(99,102,241,0.3); }

  .main-content {
    max-width: 720px; margin: 0 auto; padding: 0 16px 80px;
    transition: opacity var(--transition);
  }
  .tab-panel { display: none; animation: fadeIn 0.3s ease; }
  .tab-panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-top: 16px;
    transition: var(--transition);
  }
  .card-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 12px;
    gap: 8px;
  }
  .q-number {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 28px; height: 28px;
    background: var(--accent); color: #fff;
    border-radius: 50%; font-size: 13px; font-weight: 700;
    flex-shrink: 0;
  }
  .q-badge {
    font-size: 12px; padding: 2px 10px;
    border-radius: 12px;
    background: #e2e8f0; color: var(--text-secondary);
    flex-shrink: 0;
  }
  .q-text {
    font-size: 15px; line-height: 1.7; margin-bottom: 16px;
  }
  .q-text code, .q-text pre {
    font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", "Consolas", monospace;
    font-size: 13px;
    background: #f1f5f9;
    border-radius: 6px;
  }
  .q-text code { padding: 2px 6px; }
  .q-text pre {
    padding: 12px 16px; margin: 8px 0;
    overflow-x: auto;
    border-left: 3px solid var(--accent);
    line-height: 1.5;
  }

  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border: 2px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: var(--transition);
    background: transparent;
    font-size: 14px; line-height: 1.5;
    text-align: left; width: 100%;
  }
  .option:hover:not(.disabled) { border-color: var(--accent); background: #eef2ff; }
  .option .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #94a3b8; flex-shrink: 0; transition: var(--transition); display: flex; align-items: center; justify-content: center; }
  .option.selected .radio { border-color: var(--accent); background: var(--accent); }
  .option.selected .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
  .option.selected { border-color: var(--accent); background: #eef2ff; }
  .option.correct { border-color: var(--correct); background: var(--correct-bg); }
  .option.correct .radio { border-color: var(--correct); background: var(--correct); }
  .option.wrong { border-color: var(--wrong); background: var(--wrong-bg); animation: shake 0.4s ease; }
  .option.wrong .radio { border-color: var(--wrong); background: var(--wrong); }
  .option.disabled { cursor: default; opacity: 0.85; }
  .option.no-feedback { animation: none !important; }

  .explanation {
    margin-top: 16px; padding: 14px 16px;
    background: #f8fafc; border-radius: 10px;
    border-left: 3px solid var(--accent);
    font-size: 14px; line-height: 1.7;
    display: none;
    animation: fadeIn 0.3s ease;
  }
  .explanation.show { display: block; }

  .nav-buttons {
    display: flex; justify-content: space-between; gap: 12px;
    margin-top: 20px;
  }
  .nav-buttons button {
    padding: 10px 24px;
    border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #4f46e5; transform: translateY(-1px); }
  .btn-secondary { background: #e2e8f0; color: var(--text); }
  .btn-secondary:hover { background: #cbd5e1; }
  .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .progress-bar {
    display: flex; gap: 4px; margin: 12px 0;
    flex-wrap: wrap;
  }
  .progress-dot {
    width: 24px; height: 24px;
    border-radius: 6px;
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
    transition: var(--transition);
    background: #f8fafc;
  }
  .progress-dot.answered { background: #eef2ff; border-color: var(--accent); color: var(--accent); }
  .progress-dot.current { border-color: var(--accent); background: var(--accent); color: #fff; }
  .progress-dot.correct { background: var(--correct-bg); border-color: var(--correct); color: var(--correct); }
  .progress-dot.wrong { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center;
    padding: 24px;
    animation: fadeIn 0.3s ease;
  }
  .overlay.show { display: flex; }
  .overlay-box {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 32px;
    max-width: 440px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    text-align: center;
    position: relative;
  }
  .overlay-close {
    position: absolute; top: 12px; right: 14px;
    width: 32px; height: 32px;
    border: none; background: #f1f3f6;
    border-radius: 50%;
    font-size: 18px; line-height: 1;
    color: #888; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s;
  }
  .overlay-close:hover { background: #e2e6ed; color: #333; }
  .overlay-box h2 { font-size: 20px; margin-bottom: 12px; }
  .overlay-box p { color: var(--text-secondary); font-size: 14px; margin-bottom: 16px; }
  .pw-input {
    width: 100%; padding: 12px 16px;
    font-size: 18px; letter-spacing: 8px;
    text-align: center;
    border: 2px solid var(--border);
    border-radius: 10px;
    outline: none;
    transition: var(--transition);
  }
  .pw-input:focus { border-color: var(--accent); }
  .pw-error { color: var(--wrong); font-size: 13px; margin-top: 8px; display: none; }
  .score-big { font-size: 48px; font-weight: 800; color: var(--accent); }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
  .stat-item { padding: 12px; background: #f8fafc; border-radius: 8px; }
  .stat-item .label { font-size: 12px; color: var(--text-secondary); }
  .stat-item .value { font-size: 20px; font-weight: 700; margin-top: 4px; }

  .error-list { margin-top: 16px; text-align: left; }
  .error-list summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--accent); padding: 8px 0; }
  .error-item { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; border-bottom: 1px solid var(--border); }

  @media (max-width: 480px) {
    .app-header h1 { font-size: 17px; }
    .nav-tabs { margin: 12px 8px 0; padding: 4px; }
    .main-content { padding: 0 8px 60px; }
    .card { padding: 14px; }
    .q-text { font-size: 14px; }
    .option { padding: 10px 12px; font-size: 13px; }
    .overlay-box { padding: 20px; }
    .score-big { font-size: 36px; }
  }
</style>
</head>
<body>

<div class="app-header">
  <h1>树 综合练习 · 第5套（B卷）</h1>                   <!-- 如无指定主题，改为：📖 M月DD日练习 · 主题 -->
  <p>${副标题/知识点列表}</p>         <!-- 知识点概览，如：进制转换 · 位运算 · 网络基础 -->
</div>

<div class="nav-tabs" id="modeTabs">
  <button class="nav-tab active" data-mode="practice">📝 练习</button>
  <button class="nav-tab" data-mode="quiz">⚡ 刷题</button>
</div>

<div class="main-content" id="mainContent"></div>

<!-- 刷题密码弹窗 -->
<div class="overlay" id="pwOverlay">
  <div class="overlay-box">
    <h2>🔒 刷题模式</h2>
    <p>请输入老师提供的 6 位密码</p>
    <input type="password" class="pw-input" id="pwInput" maxlength="6" inputmode="numeric" autocomplete="off">
    <div class="pw-error" id="pwError">❌ 密码错误，请重试</div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn-secondary" style="flex:1;" onclick="closePw()">取消</button>
      <button class="btn-primary" style="flex:1;" onclick="checkPw()">确认</button>
    </div>
  </div>
</div>

<!-- 练习结果弹窗 -->
<div class="overlay" id="resultOverlay">
  <div class="overlay-box">
    <button class="overlay-close" onclick="closeResult()">✕</button>
    <h2>📄 练习报告</h2>
    <div class="score-big" id="resultScore">0/0</div>
    <p style="font-size:13px;color:#6366f1;margin-top:8px;">🔐 刷题密码：<strong id="showPw"></strong></p>
    <div class="stat-grid">
      <div class="stat-item"><div class="label">正确</div><div class="value" id="resultCorrect" style="color:var(--correct)">0</div></div>
      <div class="stat-item"><div class="label">错误</div><div class="value" id="resultWrong" style="color:var(--wrong)">0</div></div>
      <div class="stat-item"><div class="label">正确率</div><div class="value" id="resultRate">0%</div></div>
      <div class="stat-item"><div class="label">用时</div><div class="value" id="resultTime">0s</div></div>
    </div>
    <button class="btn-primary" style="width:100%;margin-bottom:8px;" onclick="closeResultAndSwitchToQuiz()">🔓 进入刷题模式看答案</button>
    <button class="btn-secondary" style="width:100%;margin-bottom:8px;" onclick="closeResultAndReset()">重新练习</button>
    <button class="btn-secondary" style="width:100%;" onclick="closeResult()">关闭窗口</button>
  </div>
</div>

<script>
// =====================================================
// ===== 使用说明：修改下面三个地方即可 =====
// =====================================================

// ===== ① 题目数据 =====
// 格式：{ "id":连续编号, "type":"single"(单选), "question":题目, "options":选项列表, "answer":正确答案字母, "score":分值 }
// 如需判断题："type":"judge", "options":["✓ 正确","✗ 错误"], "answer":"A"(正确)/"B"(错误)
// 含程序代码时，用 <pre><code>...</code></pre> 包裹，注意 JS 字符串转义

  html += '</div>';
  return html;

      }
    } else if (isPractice && val !== null) {
      if (val === oi) cls += ' selected'; // 练习模式可反复修改选项（2026-08-05 修复：去掉 disabled 锁定）
    }
    if (isPractice) cls += ' no-feedback';
    const onclick = isPractice ? `selectPractice(${currentIdx}, ${oi})` : `selectQuiz(${currentIdx}, ${oi})`;
    html += `<button class="${cls}" onclick="${onclick}">
      <span class="radio"></span><span>${q.options[oi]}</span>
    </button>`;
  }
  html += '</div>';

  // Show explanation in quiz mode
  if (isQuiz && val !== null && getExplanation(q.id)) {
    html += '<div class="explanation show"><strong>📖 解析：</strong>' + getExplanation(q.id) + '</div>';
  }

  // Nav buttons
  html += '<div class="nav-buttons">';
  if (isPractice) {
    html += `<button class="btn-secondary" onclick="prevPractice()" ${currentIdx === 0 ? 'disabled' : ''}>← 上一题</button>`;
    html += `<button class="btn-secondary" onclick="nextPractice()" ${currentIdx >= TOTAL - 1 ? 'disabled' : ''}>下一题 →</button>`;
  } else {
    html += `<button class="btn-secondary" onclick="prevQuiz()" ${currentIdx === 0 ? 'disabled' : ''}>← 上一题</button>`;
    html += `<button class="btn-secondary" onclick="nextQuiz()" ${currentIdx >= TOTAL - 1 ? 'disabled' : ''}>下一题 →</button>`;
  }
  html += '</div>';

  // Practice: submit button
  if (isPractice) {
    let answered = practiceAnswers.filter(a => a !== null).length;
    html += `<div style="text-align:center;margin-top:16px;">
      <button class="btn-primary" onclick="submitPractice()" style="padding:12px 40px;font-size:16px;">${answered === TOTAL ? '📥 交卷' : '📥 交卷（' + answered + '/' + TOTAL + '）'}</button>
    </div>`;
  }

  html += '</div>';
  return html;
}

/* ===== Practice Actions ===== */
function selectPractice(idx, oi) {
  practiceAnswers[idx] = oi;
  if (!practiceStartTime) practiceStartTime = Date.now();
  render();
}

function prevPractice() { if (currentIdx > 0) { currentIdx--; render(); } }
function nextPractice() { if (currentIdx < TOTAL - 1) { currentIdx++; render(); } }
function goPractice(i) { currentIdx = i; render(); }

function submitPractice() {
  let correct = 0, wrong = 0;
  let errorItems = [];
  for (let i = 0; i < TOTAL; i++) {
    const q = QUESTION_BANK[i];
    const s = q.score;
    if (practiceAnswers[i] !== null) {
      const ansIdx = q.options.findIndex(o => o.startsWith(q.answer + '.'));
      if (practiceAnswers[i] === ansIdx) {
        correct += s;
      } else {
        wrong += s;
        errorItems.push({ id: q.id, your: q.options[practiceAnswers[i]], correct: q.answer });
      }
    } else {
      wrong += s;
      errorItems.push({ id: q.id, your: '未答', correct: q.answer });
    }
  }
  const elapsed = practiceStartTime ? Math.floor((Date.now() - practiceStartTime) / 1000) : 0;
  const rate = TOTAL_SCORE > 0 ? Math.round(correct / TOTAL_SCORE * 100) : 0;

  // Build result overlay content
  let errHtml = '';
  if (errorItems.length > 0) {
    errHtml = '<details class="error-list"><summary>❌ 查看错题（' + errorItems.length + ' 题）</summary>';
    for (const e of errorItems) {
      let correctOpt = '';
      const q = QUESTION_BANK.find(qq => qq.id === e.id);
      if (q) correctOpt = q.options.find(o => o.startsWith(q.answer + '.')) || q.answer;
      errHtml += `<div class="error-item"><span>第 ${e.id} 题</span><span>你的答案：${e.your}　正确：${correctOpt}</span></div>`;
    }
    errHtml += '</details>';
  }

  document.querySelector('#resultOverlay .overlay-box').innerHTML = 
    `<button class="overlay-close" onclick="closeResult()">✕</button>
    <h2>📄 练习报告</h2>
    <div class="score-big">${correct}/${TOTAL_SCORE}</div>
    <p style="font-size:13px;color:#6366f1;margin-top:8px;">🔐 刷题密码：<strong>${PASSWORD}</strong></p>
    <div class="stat-grid">
      <div class="stat-item"><div class="label">正确</div><div class="value" style="color:var(--correct)">${correct}分</div></div>
      <div class="stat-item"><div class="label">错误</div><div class="value" style="color:var(--wrong)">${wrong}分</div></div>
      <div class="stat-item"><div class="label">正确率</div><div class="value">${rate}%</div></div>
      <div class="stat-item"><div class="label">用时</div><div class="value">${elapsed}s</div></div>
    </div>${errHtml}
    <button class="btn-primary" style="width:100%;margin-bottom:8px;" onclick="closeResultAndSwitchToQuiz()">🔓 进入刷题模式看答案</button>
    <button class="btn-secondary" style="width:100%;margin-bottom:8px;" onclick="closeResultAndReset()">重新练习</button>
    <button class="btn-secondary" style="width:100%;" onclick="closeResult()">关闭窗口</button>`;
  
  document.getElementById('resultOverlay').classList.add('show');
}

function closeResult() { document.getElementById('resultOverlay').classList.remove('show'); render(); } // 2026-08-05 修复：返回后刷新状态，保证可再次交卷
document.getElementById('resultOverlay').addEventListener('click', function(e) { if(e.target===this) closeResult(); });

function closeResultAndSwitchToQuiz() {
  document.getElementById('resultOverlay').classList.remove('show');
  practiceAnswers = new Array(TOTAL).fill(null);
  practiceStartTime = null;
  currentIdx = 0;
  quizUnlocked = true;
  switchMode('quiz');
}

function closeResultAndReset() {
  document.getElementById('resultOverlay').classList.remove('show');
  practiceAnswers = new Array(TOTAL).fill(null);
  practiceStartTime = null;
  currentIdx = 0;
  render();
}

/* ===== Quiz Actions ===== */
function selectQuiz(idx, oi) {
  quizAnswers[idx] = oi;
  render();
}

function prevQuiz() { if (currentIdx > 0) { currentIdx--; render(); } }
function nextQuiz() { if (currentIdx < TOTAL - 1) { currentIdx++; render(); } }
function goQuiz(i) { currentIdx = i; render(); }

/* ===== Password ===== */
function checkPw() {
  const input = document.getElementById('pwInput').value;
  if (input === PASSWORD) {
    quizUnlocked = true;
    document.getElementById('pwOverlay').classList.remove('show');
    document.getElementById('pwError').style.display = 'none';
    document.getElementById('pwInput').value = '';
    render();
  } else {
    document.getElementById('pwError').style.display = 'block';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}

function closePw() {
  document.getElementById('pwOverlay').classList.remove('show');
  document.getElementById('pwError').style.display = 'none';
  document.getElementById('pwInput').value = '';
  switchMode('practice');
}

/* ===== Mode Switching ===== */
function switchMode(newMode) {
  mode = newMode;
  currentIdx = 0;
  document.querySelectorAll('.nav-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.mode === newMode);
  });
  if (newMode === 'quiz' && !quizUnlocked) {
    renderQuizLocked();
  } else {
    render();
  }
}

document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => switchMode(tab.dataset.mode));
});

/* ===== Init ===== */
render();
</script>
</body>
</html>
