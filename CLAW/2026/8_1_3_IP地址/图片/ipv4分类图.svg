<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
<rect width="760" height="460" fill="#f8fafc" rx="12"/>
<text x="30" y="48" font-size="22" font-weight="bold" fill="#1e293b">IPv4 地址分类（看第一段）</text>
<rect x="40" y="80" width="680" height="58" rx="10" fill="#fff" stroke="#6366f1" stroke-width="2"/>
<rect x="40" y="80" width="90" height="58" rx="10" fill="#6366f1"/>
<text x="85" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">A 类</text>
<text x="85" y="126" text-anchor="middle" font-size="11" fill="#e0e7ff">首段</text>
<text x="160" y="116" font-size="18" font-weight="bold" fill="#1e293b">1 ~ 126</text>
<text x="330" y="116" font-size="15" fill="#475569">用途：超大型网络</text>
<text x="560" y="116" font-size="13" fill="#94a3b8">例：10.0.0.1</text>
<rect x="40" y="152" width="680" height="58" rx="10" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
<rect x="40" y="152" width="90" height="58" rx="10" fill="#8b5cf6"/>
<text x="85" y="182" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">B 类</text>
<text x="85" y="198" text-anchor="middle" font-size="11" fill="#e0e7ff">首段</text>
<text x="160" y="188" font-size="18" font-weight="bold" fill="#1e293b">128 ~ 191</text>
<text x="330" y="188" font-size="15" fill="#475569">用途：中型网络</text>
<text x="560" y="188" font-size="13" fill="#94a3b8">例：172.16.0.1</text>
<rect x="40" y="224" width="680" height="58" rx="10" fill="#fff" stroke="#06b6d4" stroke-width="2"/>
<rect x="40" y="224" width="90" height="58" rx="10" fill="#06b6d4"/>
<text x="85" y="254" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">C 类</text>
<text x="85" y="270" text-anchor="middle" font-size="11" fill="#e0e7ff">首段</text>
<text x="160" y="260" font-size="18" font-weight="bold" fill="#1e293b">192 ~ 223</text>
<text x="330" y="260" font-size="15" fill="#475569">用途：小型网络</text>
<text x="560" y="260" font-size="13" fill="#94a3b8">例：192.168.1.1</text>
<rect x="40" y="296" width="680" height="58" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
<rect x="40" y="296" width="90" height="58" rx="10" fill="#f59e0b"/>
<text x="85" y="326" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">D 类</text>
<text x="85" y="342" text-anchor="middle" font-size="11" fill="#e0e7ff">首段</text>
<text x="160" y="332" font-size="18" font-weight="bold" fill="#1e293b">224 ~ 239</text>
<text x="330" y="332" font-size="15" fill="#475569">用途：组播</text>
<text x="560" y="332" font-size="13" fill="#94a3b8">例：224.0.0.1</text>
<rect x="40" y="368" width="680" height="58" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect x="40" y="368" width="90" height="58" rx="10" fill="#94a3b8"/>
<text x="85" y="398" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">E 类</text>
<text x="85" y="414" text-anchor="middle" font-size="11" fill="#e0e7ff">首段</text>
<text x="160" y="404" font-size="18" font-weight="bold" fill="#1e293b">240 ~ 255</text>
<text x="330" y="404" font-size="15" fill="#475569">用途：保留</text>
<text x="560" y="404" font-size="13" fill="#94a3b8">例：240.0.0.1</text>
<text x="40" y="455" font-size="14" fill="#64748b">口诀：1 2 8 1 9 2 2 2 4 → A(1~126) B(128~191) C(192~223)；127 是回环地址，不属于 A 类</text>
</svg>